<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Document Analyst</title>
    <link rel="icon" href="/src/assets/icon-32.png" sizes="32x32" />
    <link rel="icon" href="/src/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" />
    <script>
      // Before first paint, so a dark-mode reviewer never sees a white flash.
      // An explicit choice wins; otherwise follow the system.
      const saved = localStorage.getItem("theme");
      document.documentElement.dataset.theme =
        saved ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
