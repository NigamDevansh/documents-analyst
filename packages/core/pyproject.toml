[project]
name = "documents-analyst-core"
version = "0.1.0"
description = "Shared library: parsing, provenance, taxonomy, retrieval, LLM client."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Nothing here imports FastAPI, SQLAlchemy or LangGraph. Core is a library of
# capabilities, not application wiring. See docs/CORE_INTERNALS.md §1.
# Every entry is imported by something under src/documents_analyst_core. Six more used to
# sit here and were not: `httpx-sse` and `mcp` belonged to deleted stubs,
# `structlog` was never imported at all, `python-docx` is a dev-script need, and
# `pydantic`/`pyyaml` were core carrying the worker's dependencies for it.
dependencies = [
    "httpx>=0.27",
    "pdfplumber>=0.11",          # PyMuPDF rejected — AGPL, wrong licence to ship
    "jsonschema>=4.22",          # structured LLM output is checked by us, not the vendor
    "google-genai>=1.0",         # the default provider — see settings._DEFAULT_MODELS
    "anthropic>=0.34",
    "openai>=1.40",
]

[project.optional-dependencies]
# The heavy tier. Our image installs core[ml]; a local venv does not, so
# `uv sync` at the repo root stays lean and fast.
ml = [
    "torch>=2.3",
    "transformers>=4.44",        # NLI cross-encoder
    "gliner>=0.2.13",            # party candidates
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documents_analyst_core"]
